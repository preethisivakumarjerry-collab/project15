<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Image</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

body {
    background: #f8f9fa;
    font-family: Arial;
    transition: 0.3s;
}

.dark-mode {
    background: #121212;
    color: white;
}

.card-box {
    text-align: center;
    padding: 15px;
}

.img-box {
    width: 100%;
    height: 200px;
}

.img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.full-box {
    width: 100%;
    height: 200px;
}

.full-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.full-img {
    width: 100%;
    height: 300px;
}

.full-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.circle-box {
    width: 200px;
    height: 200px;
    margin: auto;
    border-radius: 50%;
    overflow: hidden;
}

.animate {
    opacity: 0;
    transform: translateY(40px) scale(0.95);
}

.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: all 0.6s ease;
}

.img-box img:hover,
.full-box img:hover,
.full-img img:hover {
    transform: scale(1.05);
    transition: 0.4s;
}

.toggle-btn {
    position: fixed;
    top: 15px;
    right: 15px;
}

</style>
</head>

<body>

<button class="btn btn-dark toggle-btn" onclick="toggleMode()">🌙</button>

<div class="container">

<h3 class="text-center mt-3 mb-4">Bootstrap Image</h3>

<div class="row text-center">

<!-- Rounded -->
<div class="col-md-4 card-box animate">
<h3>Rounded</h3>
<div class="img-box">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="rounded">
</div>
</div>

<!-- Circle -->
<div class="col-md-4 card-box animate">
<h3>Circle</h3>
<div class="circle-box">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
</div>
</div>

<!-- Thumbnail -->
<div class="col-md-4 card-box animate">
<h3>Thumbnail</h3>
<div class="img-box">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="img-thumbnail">
</div>
</div>

<!-- Float Left FULL -->
<div class="col-md-6 card-box animate">
<h3>Float Left</h3>
<div class="full-box">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="float-left">
</div>
</div>

<!-- Float Right FULL -->
<div class="col-md-6 card-box animate">
<h3>Float Right</h3>
<div class="full-box">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="float-right">
</div>
</div>

<!-- Center FULL -->
<div class="col-12 card-box animate">
<h3>Centered</h3>
<div class="full-img">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="mx-auto d-block">
</div>
</div>

<!-- Responsive FULL -->
<div class="col-12 card-box animate">
<h3>Responsive</h3>
<div class="full-img">
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="img-fluid">
</div>
</div>

</div>

</div>

<script>

function toggleMode(){
    document.body.classList.toggle("dark-mode");
}

window.onload = function(){
    let items = document.querySelectorAll(".animate");

    items.forEach((el, i) => {
        setTimeout(() => {
            el.classList.add("show");
        }, i * 350);
    });
}

</script>

</body>
</html>
